<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大学就业求职竞争力整理助手</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #171a1f;
      --muted: #656d78;
      --line: #dfe3e8;
      --primary: #2057a7;
      --primary-2: #123d7a;
      --soft-blue: #eaf2ff;
      --soft-green: #e8f6ee;
      --soft-amber: #fff3d7;
      --soft-red: #ffecea;
      --green: #138a45;
      --blue: #246bca;
      --amber: #9f6500;
      --red: #c73b2f;
      --violet: #6c4ab6;
      --shadow: 0 14px 35px rgba(18, 35, 64, 0.08);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(180deg, #eef4fb 0, rgba(246, 247, 249, 0) 330px),
        var(--bg);
    }

    header {
      padding: 26px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar {
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 3vw, 38px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 860px;
      font-size: 14px;
    }

    .status-pill {
      white-space: nowrap;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 999px;
      padding: 9px 13px;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      max-width: 1320px;
      margin: 0 auto;
      padding: 22px 28px 42px;
      display: grid;
      grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .form-panel {
      position: sticky;
      top: 106px;
      overflow: hidden;
    }

    .panel-head {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2, .report-section h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .panel-head p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    form {
      padding: 16px 18px 18px;
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-weight: 650;
      font-size: 13px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 11px;
      font: inherit;
      font-size: 14px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
      line-height: 1.45;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(32, 87, 167, 0.12);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .masters-extra {
      display: none;
      padding: 12px;
      border: 1px dashed #bdd0ea;
      background: #f8fbff;
      border-radius: 8px;
      gap: 12px;
    }

    .masters-extra.show { display: grid; }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-btn {
      color: var(--primary);
      background: #fff;
      border: 1px solid #cdddf5;
      box-shadow: none;
    }

    .mode-btn.active {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
    }

    .mode-btn:hover {
      box-shadow: none;
    }

    .school-extra {
      display: none;
      gap: 12px;
    }

    .school-extra.show {
      display: grid;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 13px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      color: #fff;
      background: var(--primary);
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }

    button:hover {
      background: var(--primary-2);
      box-shadow: 0 8px 18px rgba(32, 87, 167, 0.18);
      transform: translateY(-1px);
    }

    button.secondary {
      background: #263445;
    }

    button.secondary:hover {
      background: #172232;
    }

    button.ghost {
      color: var(--primary);
      background: var(--soft-blue);
      border: 1px solid #cdddf5;
    }

    button.ghost:hover {
      background: #dfeeff;
      box-shadow: none;
    }

    .reports {
      display: grid;
      gap: 18px;
    }

    .empty-state {
      min-height: 420px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      padding: 34px;
    }

    .empty-state strong {
      display: block;
      color: var(--ink);
      font-size: 20px;
      margin-bottom: 8px;
    }

    .report {
      display: none;
      overflow: hidden;
    }

    .report.show { display: block; }

    .report-hero {
      padding: 22px;
      background: linear-gradient(135deg, #f7fbff, #ffffff 62%);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
    }

    .verdict {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--soft-green);
      color: var(--green);
      font-weight: 750;
      font-size: 13px;
      margin-bottom: 11px;
    }

    .report-hero h2 {
      margin: 0 0 8px;
      font-size: 25px;
      letter-spacing: 0;
    }

    .report-hero p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .score-circle {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--primary) calc(var(--score) * 1%), #e8edf3 0);
      position: relative;
      flex: 0 0 auto;
    }

    .score-circle::after {
      content: "";
      width: 82px;
      height: 82px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
    }

    .score-circle span {
      position: relative;
      z-index: 1;
      font-size: 25px;
      font-weight: 850;
    }

    .report-body {
      padding: 20px 22px 24px;
      display: grid;
      gap: 18px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .metric {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .metric b {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .bar {
      height: 8px;
      border-radius: 99px;
      background: #edf1f5;
      overflow: hidden;
    }

    .bar > i {
      display: block;
      height: 100%;
      width: var(--w);
      background: var(--primary);
      border-radius: 99px;
    }

    .report-section {
      display: grid;
      gap: 11px;
    }

    .analysis-list, .risk-list, .todo-list, .source-list {
      margin: 0;
      padding-left: 19px;
      color: #27313e;
      line-height: 1.68;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 5px 10px;
      background: #f0f3f7;
      color: #2a3544;
      font-size: 12px;
      font-weight: 700;
    }

    .tag.fact { background: var(--soft-blue); color: var(--primary); }
    .tag.infer { background: var(--soft-amber); color: var(--amber); }

    .plan-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .plan-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      background: #fff;
    }

    .plan-card h3 {
      margin: 0 0 9px;
      font-size: 15px;
    }

    .plan-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .role-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 15px;
      background: #fff;
      display: grid;
      gap: 12px;
    }

    .role-title {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
    }

    .role-title h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 0;
    }

    .role-heading {
      display: grid;
      gap: 7px;
    }

    .role-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .role-label {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 850;
    }

    .role-label.target {
      color: #2057a7;
      background: #eaf2ff;
      border: 1px solid #cdddf5;
    }

    .role-label.recommend {
      color: #138a45;
      background: #e8f6ee;
      border: 1px solid #c5e8d2;
    }

    .match {
      color: var(--green);
      font-weight: 850;
      white-space: nowrap;
    }

    .mini {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .company-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .company {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 9px;
      background: #fff;
      font-size: 12px;
      color: #111827;
      font-weight: 700;
    }

    .tier {
      margin-left: 4px;
      font-weight: 850;
    }

    .tier.t0 { color: var(--green); }
    .tier.t1 { color: var(--blue); }
    .tier.t2 { color: var(--violet); }
    .tier.t3 { color: var(--amber); }
    .tier.t4 { color: var(--red); }

    .radar-wrap {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 13px;
      align-items: center;
    }

    .radar {
      width: 230px;
      height: 230px;
    }

    .axis-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .axis-list span {
      color: var(--muted);
      font-size: 12px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 13px;
    }

    .table th, .table td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.45;
    }

    .table th {
      background: #f3f6fa;
      font-size: 12px;
      color: #4e5967;
    }

    .table tr:last-child td { border-bottom: 0; }

    .notice {
      border: 1px solid #f2d69a;
      background: #fff9eb;
      color: #6f4a00;
      border-radius: 8px;
      padding: 12px 13px;
      line-height: 1.55;
      font-size: 13px;
    }

    .stale-banner {
      display: none;
      border: 1px solid #cdddf5;
      background: #eef5ff;
      color: #184a8b;
      border-radius: 8px;
      padding: 11px 13px;
      font-size: 13px;
      line-height: 1.5;
      margin: 0 0 14px;
    }

    .stale-banner.show {
      display: block;
    }

    @media (max-width: 1040px) {
      main {
        grid-template-columns: 1fr;
      }
      .form-panel {
        position: static;
      }
    }

    @media (max-width: 760px) {
      header, main {
        padding-left: 16px;
        padding-right: 16px;
      }
      .topbar, .report-hero {
        grid-template-columns: 1fr;
        display: grid;
      }
      .grid-2, .score-grid, .plan-grid, .role-grid {
        grid-template-columns: 1fr;
      }
      .radar-wrap {
        grid-template-columns: 1fr;
      }
      .status-pill {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>大学就业求职竞争力整理助手</h1>
        <p class="subtitle">面向 QS200 内院校，生成国内中厂/大厂求职竞争力评估，并支持从学校、专业、学位和课程反推就业路线。事实项和经验判断会分开标注。</p>
      </div>
      <div class="status-pill">QS2027 前 200 知识库 · 含马来西亚</div>
    </div>
  </header>

  <main>
    <section class="panel form-panel">
      <div class="panel-head">
        <h2>输入信息</h2>
        <p id="formHint">先选择国家/地区，再选择学校。点击测试用例可自动填入你给的背景。</p>
      </div>
      <form id="profileForm">
        <div class="mode-switch" aria-label="学校范围">
          <button type="button" id="qsTopBtn" class="mode-btn active">QS前200</button>
          <button type="button" id="qsAfterBtn" class="mode-btn">QS200之后</button>
        </div>

        <div class="grid-2">
          <label id="countryLabel">国家/地区
            <select id="country"></select>
          </label>
          <label id="universitySelectLabel">大学
            <select id="university"></select>
          </label>
          <label id="customUniversityLabel" style="display:none;">大学
            <input id="customUniversity" placeholder="如 北京交通大学 / 深圳大学" />
          </label>
        </div>

        <div id="schoolExtra" class="school-extra">
          <div class="grid-2">
            <label>院校属性
              <select id="schoolTier">
                <option>自动识别</option>
                <option>985</option>
                <option>211</option>
                <option>双非/海外非QS200</option>
              </select>
            </label>
            <label>QS排名（可选）
              <input id="customQsRank" type="number" min="1" placeholder="985/211可填，未知可空" />
            </label>
          </div>
          <label>中国国内排名（QS200之后模式建议填写）
            <input id="customChinaRank" type="number" min="1" placeholder="如 80；非985/211主要用国内排名参与分析" />
          </label>
        </div>

        <div class="grid-2">
          <label>学位等级
            <select id="degree">
              <option>本科</option>
              <option selected>硕士</option>
              <option>博士</option>
            </select>
          </label>
          <label>专业名称
            <input id="major" placeholder="如 Computer Science / 金融工程" />
          </label>
        </div>

        <div id="mastersExtra" class="masters-extra">
          <label>本科学校
            <input id="bachelorSchool" placeholder="选择硕士/博士时填写，如 南京大学" />
          </label>
          <label>本科专业
            <input id="bachelorMajor" placeholder="选择硕士/博士时填写，如 电子信息工程" />
          </label>
          <label class="doctor-extra">硕士学校
            <input id="masterSchool" placeholder="选择博士时填写，如 香港科技大学" />
          </label>
          <label class="doctor-extra">硕士专业
            <input id="masterMajor" placeholder="选择博士时填写，如 Data Science" />
          </label>
        </div>

        <label>核心课程内容
          <textarea id="courses" placeholder="粘贴课程列表，系统会识别硬技能和岗位相关性"></textarea>
        </label>

        <label>目标岗位
          <textarea id="targetRoles" placeholder="如 产品经理、数据分析、商业分析、算法工程师、前端工程师、后端工程师、AI/ML工程师"></textarea>
        </label>

        <label>目标城市/行业
          <textarea id="targetCities" placeholder="如 上海、杭州、深圳、广州；互联网、金融科技、企业软件"></textarea>
        </label>

        <label>个人背景
          <textarea id="background" placeholder="实习、项目、语言、GPA、工作经历、年龄、籍贯等，可选"></textarea>
        </label>

        <div class="actions">
          <button type="button" id="caseBtn" class="ghost">填入测试用例</button>
          <button type="button" id="evaluateBtn">生成求职竞争力报告</button>
          <button type="button" id="recommendBtn" class="secondary">推荐就业计划</button>
        </div>
      </form>
    </section>

    <section class="reports">
      <div id="empty" class="panel empty-state">
        <div>
          <strong>先填信息，再生成报告</strong>
          <p>左侧表单会驱动学校认可度、课程实用性、岗位路线、城市和企业层级建议。</p>
        </div>
      </div>

      <article id="competitionReport" class="panel report"></article>
      <article id="careerReport" class="panel report"></article>
    </section>
  </main>

    function normalizedCourseLines(courses) {
      return String(courses || "")

    function textOf(...parts) {

    function hasAny(text, words) {
      return words.some(word => text.includes(word.toLowerCase()));

    function signalSet(text) {
      const cleanText = String(text || "").toLowerCase();
      const forensicOnly = /forensic analytics/.test(cleanText) && !/business analytics|data analytics|big data|data mining|statistics|statistical|sql|python|bi|tableau|power bi|数据分析|统计|指标/.test(cleanText);
      return {
        data: !forensicOnly && hasAny(cleanText, ["business analytics", "data analytics", "big data", "data mining", "statistics", "statistical", "sql", "python", "bi", "tableau", "power bi", "数据分析", "统计", "指标", "数据挖掘"]),
        product: hasAny(cleanText, ["product", "产品", "prd", "用户", "需求", "management", "governance", "audit", "risk", "商业", "运营"]),
        engineering: hasAny(cleanText, ["software", "java", "c++", "go", "node", "react", "vue", "javascript", "typescript", "database", "backend", "frontend", "project", "项目", "系统", "编程", "前端", "后端"]),
        ai: hasAny(cleanText, ["ai", "ml", "machine learning", "deep learning", "model", "nlp", "cv", "算法", "模型", "机器学习", "深度学习"]),
        finance: hasAny(cleanText, ["finance", "financial", "bank", "accounting", "investment", "金融", "会计", "投行", "证券", "银行"]),
        consulting: hasAny(cleanText, ["consulting", "strategy", "case", "market", "咨询", "战略", "市场", "商业分析"]),
        governance: hasAny(cleanText, ["security", "identity", "access", "cryptography", "forensic", "audit", "compliance", "risk", "governance", "风控", "合规", "审计", "治理", "权限"])
      };
    }

    function detectSignals(p) {
      const majorCourse = signalSet(textOf(p.major, p.courses));
      const role = signalSet(p.roles);
      const background = signalSet(textOf(p.background, p.bachelorMajor));
      const all = signalSet(textOf(p.major, p.courses, p.roles, p.cities, p.background, p.bachelorMajor));
      return {

        background,
        internship: hasAny(textOf(p.background), ["实习", "intern", "项目", "project", "工作", "经历", "experience"]),

      const courseHits = [signals.course.data, signals.course.product, signals.course.engineering, signals.course.ai, signals.course.finance, signals.course.governance].filter(Boolean).length;
      const roleHits = [signals.role.data && signals.course.data, signals.role.product && signals.course.product, signals.role.engineering && signals.course.engineering, signals.role.ai && signals.course.ai, signals.role.finance && signals.course.finance, signals.role.governance && signals.course.governance].filter(Boolean).length;
      const hasExperience = signals.internship;
      const professionalFit = clamp(3.8 + roleHits * 1.05 + courseHits * 0.32 + (signals.ehs && (signals.course.product || signals.course.governance) ? 0.55 : 0) + (hasExperience ? 0.35 : 0), 3.5, 8.4);
      const courseValue = clamp(3.9 + courseHits * 0.72 + (signals.course.engineering || signals.course.ai ? 0.45 : 0) + (normalizedCourseLines(p.courses).some(line => /project|项目/i.test(line)) ? 0.45 : 0), 3.6, 8.3);

        brand: Number(brand.toFixed(1)),
        degree: Number(degreeBoost.toFixed(1)),
        professionalFit: Number(professionalFit.toFixed(1)),
        courseValue: Number(courseValue.toFixed(1)),
        filterFriendly: Number(filterFriendly.toFixed(1)),
        domestic: Number(domestic.toFixed(1)),
        overall: Number(overall.toFixed(1))
      };
    }

      if (signals.course.governance) tags.push("治理、风控或合规");
      return `当前填写 ${courseItems.length || lines.length} 门/项课程，样例包括：${shown || lines.slice(0, 6).map(escapeHtml).join("、")}${(courseItems.length || lines.length) > 6 ? "等" : ""}。课程证据可识别方向：${tags.length ? tags.join("、") : "通用理论或待进一步拆分的课程" }。`;
    }

    function fitSentence(signals, roles) {
      const roleText = roles || "未填写目标岗位";
      const fits = [];
      if (signals.course.data) fits.push("数据分析、商业分析、策略分析");
      if (signals.course.product) fits.push("产品经理、运营策略、B 端产品");
      if (signals.course.engineering) fits.push("前端、后端、测试开发或技术产品");
      if (signals.course.ai) fits.push("AI 应用、算法工程、模型应用产品");
      if (signals.course.finance) fits.push("金融科技、风控分析、投研支持");
      if (signals.course.governance) fits.push("合规科技、风控产品、企业治理数字化");
      return `用户目标岗位为「${escapeHtml(roleText)}」。基于当前专业和课程，优先匹配方向为：${fits.length ? fits.join("；") : "需要先明确岗位能力栈后再判断" }。`;

    function schoolFactSentence(p) {

    function dynamicRisks(p, signals) {
      const risks = [];
      if (signals.oneYear || p.major.includes("1年")) risks.push("1 年制项目需要用实习、项目、作品集补足经历厚度。");

      if (!signals.internship) risks.push("当前背景里缺少明确实习、项目或工作证据，简历筛选友好度会受影响。");
      if ((p.roles.match(/、|,|，|\//g) || []).length >= 4) risks.push("目标岗位跨度较大，容易稀释求职叙事，建议保留 2 条主线和 1 条备选线。");
      if ((p.roles.includes("算法") || p.roles.toLowerCase().includes("ai") || p.roles.toLowerCase().includes("ml")) && !signals.ai) risks.push("目标包含算法或 AI/ML，但课程中缺少明显模型、机器学习或数学建模证据。");
      if ((p.roles.includes("前端") || p.roles.includes("后端")) && !signals.engineering) risks.push("目标包含工程岗，但课程中缺少明确编程语言、数据库、框架或工程项目证据。");
      if (!p.courses) risks.push("未填写课程时，课程实用性只能低置信估算。");
      return (risks.length ? risks : ["当前风险主要来自公开信息不足，建议补充课程、项目、实习和目标 JD。"]).map(r => `<li>${escapeHtml(r)}</li>`).join("");

    function pointsForRadar(values) {
      const cx = 115, cy = 115, radius = 72;
      return values.map((v, i) => {
        const angle = (-90 + i * 60) * Math.PI / 180;
        const r = radius * v / 100;
        return `${cx + Math.cos(angle) * r},${cy + Math.sin(angle) * r}`;
      }).join(" ");
    }

    function radarSvg(values) {
      const grid = [25, 50, 75, 100].map(level => {
        const pts = pointsForRadar(Array(6).fill(level));
        return `<polygon points="${pts}" fill="none" stroke="#dfe3e8" stroke-width="1"></polygon>`;
      }).join("");
      const axesLines = Array.from({ length: 6 }, (_, i) => {
        const angle = (-90 + i * 60) * Math.PI / 180;
        return `<line x1="115" y1="115" x2="${115 + Math.cos(angle) * 72}" y2="${115 + Math.sin(angle) * 72}" stroke="#e4e8ee" stroke-width="1"></line>`;
      }).join("");
      const labels = axes.map((axis, i) => {
        const angle = (-90 + i * 60) * Math.PI / 180;
        const x = 115 + Math.cos(angle) * 100;
        const y = 115 + Math.sin(angle) * 100;
        const anchor = i === 0 || i === 3 ? "middle" : i < 3 ? "start" : "end";
        const dy = i === 0 ? "-2" : i === 3 ? "10" : "4";
        return `<text x="${x}" y="${y}" text-anchor="${anchor}" dy="${dy}" font-size="10.5" font-weight="700" fill="#4e5967">${axis}</text>`;
      }).join("");
      return `<svg class="radar" viewBox="0 0 230 230" role="img" aria-label="六维岗位评估">${grid}${axesLines}<polygon points="${pointsForRadar(values)}" fill="rgba(32,87,167,.22)" stroke="#2057a7" stroke-width="2"></polygon><circle cx="115" cy="115" r="2.5" fill="#2057a7"></circle>${labels}</svg>`;
    }

    function companyChips(companies) {
      return `<div class="company-row">${companies.map(([name, tier]) => `<span class="company">${escapeHtml(name)}<span class="tier ${tierColors[tier]}">${tier}</span></span>`).join("")}</div>`;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function roleCategory(name) {
      if (name.includes("数据")) return "data";
      if (name.includes("商业")) return "business";
      if (name.includes("产品")) return "product";
      if (name.includes("前端") || name.includes("后端")) return "engineering";
      if (name.includes("算法") || name.includes("AI") || name.includes("ML")) return "ai";
      if (name.includes("安全") || name.includes("风控") || name.includes("合规")) return "governance";
      return "general";
    }

    function adjustRoleData(name, template, p, signals) {
      const category = roleCategory(name);
      let delta = 0;
      if (category === "data" && signals.course.data) delta += 10;
      if (category === "business" && (signals.course.data || signals.course.finance || signals.course.product)) delta += 7;
      if (category === "product" && signals.course.product) delta += 8;
      if (category === "engineering" && signals.course.engineering) delta += 10;
      if (category === "ai" && signals.course.ai) delta += 13;
      if (category === "governance" && signals.course.governance) delta += 13;
      if (signals.ehs && ["product", "business", "governance"].includes(category)) delta += 4;
      if (!signals.internship) delta -= 5;
      if (category === "engineering" && !signals.course.engineering) delta -= 13;
      if (category === "ai" && !signals.course.ai) delta -= 16;
      if (category === "data" && !signals.course.data) delta -= 15;
      if (category === "product" && !signals.course.product) delta -= 7;
      if (category === "business" && !(signals.course.data || signals.course.finance || signals.course.product || signals.ehs)) delta -= 8;

      const match = clamp(template.match + delta, 35, 95);
      const radar = template.radar.map((value, index) => {
        let adjusted = value + Math.round(delta * 0.75);
        if (index === 2 && (category === "engineering" || category === "ai")) adjusted += signals.course.engineering || signals.course.ai ? 2 : -8;
        if (index === 1 && signals.ehs && ["product", "business", "governance"].includes(category)) adjusted += 5;
        if (index === 0 && !signals.internship) adjusted -= 5;
        return clamp(adjusted, 25, 96);
      });

      const summaryParts = [];
      if (category === "data") summaryParts.push(signals.course.data ? "专业/课程中有明确数据分析、统计、SQL/Python 或 BI 证据，可用作品继续强化。" : "专业/课程中没有明确数据分析课程证据；若投该岗，需要先补 SQL、统计、Python 和业务指标项目。");
      if (category === "business") summaryParts.push(signals.course.finance || signals.course.product || signals.ehs ? "课程或背景能支撑行业理解、治理或商业判断，但仍需案例和数据化表达。" : "商业分析证据不足，需要补行业研究、案例分析和商业建模。");
      if (category === "product") summaryParts.push(signals.course.product ? "专业/课程中包含管理、治理、需求或风险类信号，适合做 B 端/行业产品切入。" : "课程中产品方法证据不足，需要补 PRD、竞品分析、用户流程和指标体系。");
      if (category === "engineering") summaryParts.push(signals.course.engineering ? "课程有工程或项目信号，但国内工程岗仍要看代码仓库和可运行项目。" : "课程中缺少明确编程语言、数据库或工程项目，直接投纯研发岗难度偏高。");
      if (category === "ai") summaryParts.push(signals.course.ai ? "专业/课程中有 AI/ML 信号，可优先走 AI 应用或模型落地方向。" : "课程中缺少 AI/ML、模型或数学建模证据，核心算法/AI 工程路线应降级为备选。");
      if (category === "governance") summaryParts.push(signals.course.governance ? "课程中治理、风险、身份、审计或合规信号明显，是当前背景的强匹配方向。" : "若想走该方向，需要补风险治理、权限体系和合规案例。");

      const difficulty = match >= 82 ? "中等偏低" : match >= 72 ? "中等" : match >= 62 ? "中等偏高" : "高";
      return {
        ...template,
        match,
        radar,
        difficulty,
        summary: summaryParts.join(" ") || template.summary
      };
    }

    function requestedRoles() {
      const raw = $("targetRoles").value;

    function autoRecommendationReasons(signals) {
      const reasons = [];
      if (signals.course.governance) reasons.push("课程中有治理、身份权限、审计、风险或合规证据");
      if (signals.ehs) reasons.push("背景中有工科/EHS/风险治理经验，可迁移到行业数字化");
      if (signals.course.product) reasons.push("课程中有管理、治理或业务流程信号");
      if (signals.course.data) reasons.push("课程中有明确数据、统计或 BI 证据");
      if (signals.course.engineering) reasons.push("课程中有工程项目或系统实践证据");
      if (signals.course.ai) reasons.push("课程中有 AI/ML 或模型相关证据");
      return reasons.length ? reasons.join("；") : "基于学校、专业、课程和背景的综合匹配度更高";
    }

    function recommendedRoleNames(p, signals) {
      const selected = requestedRoles();
      const selectedSet = new Set(selected);
      const pool = Object.keys(roleTemplates)
        .map(name => {
          const data = adjustRoleData(name, roleTemplates[name], p, signals);
          return [name, {
            ...data,
            isTarget: selectedSet.has(name),
            isRecommended: false,
            recommendReason: ""
          }];
        })
        .sort((a, b) => b[1].match - a[1].match);

      const targetBest = pool.filter(([name]) => selectedSet.has(name))[0]?.[1].match ?? 0;
      const autoPicks = pool
        .filter(([name, data]) => !selectedSet.has(name) && (data.match > targetBest || data.match >= 72))
        .slice(0, 3)
        .map(([name, data]) => [name, {
          ...data,
          isRecommended: true,
          recommendReason: autoRecommendationReasons(signals)
        }]);

      const targetPicks = pool
        .filter(([name]) => selectedSet.has(name))
        .map(([name, data]) => [name, data]);

      const merged = [...autoPicks, ...targetPicks];
      if (!merged.length) {
        return pool.slice(0, 5).map(([name, data], index) => [name, {
          ...data,
          isRecommended: index < 2,
          recommendReason: autoRecommendationReasons(signals)
        }]);
      }

      const seen = new Set();
      return merged
        .filter(([name]) => {
          if (seen.has(name)) return false;
          seen.add(name);
          return true;
        })
        .sort((a, b) => b[1].match - a[1].match)
        .slice(0, 8);
    }

    function careerHeadline(rolePairs, signals) {
      const top = rolePairs[0]?.[0] || "数据分析";
      if (signals.course.governance) return `就业推荐：优先考虑${top}，围绕治理、风控和合规能力展开`;
      if (signals.course.ai) return `就业推荐：优先考虑${top}，从 AI 应用落地切入`;
      if (signals.course.engineering) return `就业推荐：优先考虑${top}，用工程项目提高筛选通过率`;
      if (signals.course.data) return `就业推荐：优先考虑${top}，以数据作品建立可信度`;
      return `就业推荐：先收窄到${top}等可验证路线`;
    }

    function trendAdvice(p, signals) {
      const items = [];
      items.push(`<li><span class="tag infer">经验判断</span> 近年来企业更看重降本增效、数据驱动和业务数字化；当前课程中最容易被验证的能力是：${signals.course.governance ? "治理、风控或合规" : signals.course.data ? "数据分析" : signals.course.product ? "产品/业务理解" : signals.course.engineering ? "工程实现" : signals.course.ai ? "AI 应用" : "课程与项目成果"}。</li>`);
      if (signals.ehs) items.push(`<li><span class="tag infer">经验判断</span> 工科或 EHS 背景适合转译为风险评估、流程治理、工业场景理解和跨部门推进能力。</li>`);
      if (signals.course.ai) items.push(`<li><span class="tag infer">经验判断</span> 若目标高薪 IT，可优先做 AI 应用、数据产品或模型评测项目，降低直接进入核心算法岗的门槛。</li>`);
      if (signals.course.engineering) items.push(`<li><span class="tag infer">经验判断</span> 工程岗要重点补代码仓库、部署链接、数据库和系统设计表达，避免只停留在课程描述。</li>`);
      if (signals.role.data && !signals.course.data) items.push(`<li><span class="tag infer">经验判断</span> 你把数据分析列为目标岗位，但课程未体现明确数据分析训练，因此该路线应按补短板路线处理，而不是强匹配路线。</li>`);
      if (signals.course.data) items.push(`<li><span class="tag fact">事实</span> 公开招聘 JD 中，数据/商业分析常见要求包括 SQL、Python、统计、BI、指标体系和业务解释。</li>`);
      if (signals.course.product) items.push(`<li><span class="tag fact">事实</span> 公开产品类 JD 常见要求包括需求分析、PRD、跨团队沟通、数据指标和行业理解。</li>`);
      return items.join("");
    }

    function recommendationSummary(rolePairs) {
      const recommended = rolePairs.filter(([, data]) => data.isRecommended);
      if (!recommended.length) return "";
      return recommended.map(([name, data]) => `<li><span class="tag infer">推荐</span> ${escapeHtml(name)} 综合分 ${data.match}%，高于或不低于当前目标路线；推荐原因：${escapeHtml(data.recommendReason)}。</li>`).join("");
    }

    function cityRows(p, signals) {
      const raw = p.cities || "上海、杭州、深圳、广州";
      const cityNames = ["上海", "杭州", "深圳", "广州", "北京", "苏州", "南京", "成都"].filter(city => raw.includes(city));
      const cities = cityNames.length ? cityNames : ["上海", "杭州", "深圳", "广州"];
      const industry = signals.finance ? "金融科技、银行科技、风控分析" :
        signals.course.ai ? "AI 应用、云服务、智能硬件、内容平台" :
        signals.course.engineering ? "互联网平台、企业软件、云服务" :
        signals.course.governance ? "云服务、金融科技、企业治理、合规科技" :
        signals.course.data ? "互联网、咨询、零售、电商、企业数字化" :
        "互联网、企业服务、咨询、传统行业数字化";
      return cities.slice(0, 4).map((city, index) => {
        const priority = index < 2 ? "第一梯队" : "第二梯队";
        const reason = city === "上海" ? "岗位类型均衡，金融科技、咨询和企业服务机会多。" :
          city === "杭州" ? "互联网平台和电商生态集中，产品、数据和技术岗位密度高。" :
          city === "深圳" ? "科技、金融和硬件产业强，适合技术与商业结合岗位。" :
          city === "广州" ? "竞争节奏相对缓，适合作为转行落地和作品补强城市。" :
          "可作为补充城市，用来扩大投递样本和面试机会。";
        return `<tr><td>${priority}</td><td>${city}</td><td>${industry}</td><td>${reason}</td></tr>`;
      }).join("");
    }

    function queueRows(rolePairs) {
      const top = rolePairs.slice(0, 3);
      return top.map(([name, data], index) => {
        const label = index === 0 ? "主线 A" : index === 1 ? "主线 B" : "备选 C";
        const strategy = data.match >= 80 ? "作为优先投递方向，简历首页突出课程、项目和岗位关键词。" :
          data.match >= 68 ? "作为同步投递方向，用作品集和实习经历补足证据。" :
          "作为备选方向，先完成项目或技能补强后再集中投递。";
        return `<tr><td>${label}</td><td>${escapeHtml(name)}</td><td>${companyChips(data.companies)}</td><td>${strategy}</td></tr>`;
      }).join("");
    }

    function renderCareerPlan() {
      const p = getProfile();
      const signals = detectSignals(p);
      const rolePairs = recommendedRoleNames(p, signals);
      const topScore = rolePairs[0]?.[1].match || 70;
      $("careerReport").innerHTML = `
        <div class="stale-banner" id="careerStale">表单内容已变更，请重新点击“推荐就业计划”更新分析。</div>
        <div class="report-hero">
          <div>
            <div class="verdict">${careerHeadline(rolePairs, signals)}</div>
            <h2>${escapeHtml(p.major || "当前专业")} · ${escapeHtml(p.uni.name)}</h2>
            <p>本报告基于当前填写的专业、课程、目标岗位、城市和背景生成；修改表单后再次点击按钮，会重新计算岗位排序、匹配度和六维图。</p>
          </div>
          <div class="score-circle" style="--score:${topScore}"><span>${topScore}</span></div>
        </div>
        <div class="report-body">
          <section class="report-section">
            <h2>推荐城市与行业</h2>
            <table class="table">
              <thead><tr><th>优先级</th><th>城市</th><th>适合行业</th><th>原因</th></tr></thead>
              <tbody>
                ${cityRows(p, signals)}
              </tbody>
            </table>
          </section>

          <section class="report-section">
            <h2>岗位推荐排序</h2>
            <div class="role-grid">${rolePairs.map(([name, data]) => roleCard(name, data)).join("")}</div>
          </section>

          <section class="report-section">
            <h2>近年来趋势下的路线建议</h2>
            <ul class="analysis-list">
              ${trendAdvice(p, signals)}
              ${recommendationSummary(rolePairs)}
            </ul>
          </section>

          <section class="report-section">
            <h2>建议投递队列</h2>
            <table class="table">
              <thead><tr><th>队列</th><th>岗位</th><th>目标公司层级</th><th>投递策略</th></tr></thead>
              <tbody>
                ${queueRows(rolePairs)}
              </tbody>
            </table>
          </section>

          <section class="report-section">
            <h2>引用来源</h2>
            <div class="notice">薪资为公开校招、社招样本与行业经验综合估算，城市、公司和岗位建议属于经验判断；使用前建议结合当年校招 JD 二次校准。</div>
            ${sourceList()}
          </section>
        </div>
      `;
      lastRenderedReport = "career";
      lastRenderedSnapshot = profileSnapshot();
      showOnly("careerReport");
    }

    function fillCase() {
      setSchoolMode("top200");
      countrySelect.value = "马来西亚";
      renderUniversities();
      universitySelect.value = "Universiti Sains Malaysia (USM)";
      degreeSelect.value = "硕士";
      toggleMasters();
      $("bachelorSchool").value = "华东理工大学";
      $("bachelorMajor").value = "油气储运工程";
      $("masterSchool").value = "";
      $("masterMajor").value = "";
      $("major").value = "Cyber Security，1年制授课型硕士";
      $("courses").value = [
        "Semester I",
        "Internet Governance (core - 4 units)",
        "Advanced Internet Security (core - 4 units)",
        "Cybersecurity Research Methodology (core - 4 units)",
        "Cyber Security Audit and Assessment (elective - 4 units)",
        "Cyber Operations (elective - 4 units)",
        "Information Security and Cryptography (elective - 4 units)",
        "Semester II",
        "Identity and Access Management (core - 4 units)",
        "Authorized Security Testing (core - 4 units)",
        "Cyber Security Project (core - 10 units)",
        "Security and Risk Management (elective - 4 units)",
        "Security Intelligence (elective - 4 units)",
        "Forensic Analytics and Digital Investigations (elective - 4 units)"
      ].join("\n");
      $("targetRoles").value = "产品经理、数据分析、商业分析、算法工程师、前端工程师、后端工程师、AI/ML工程师";
      $("targetCities").value = "第一梯队：上海、杭州；第二梯队：深圳、广州";
      $("background").value = "江苏人，25岁，男。本科：华东理工大学油气储运工程专业学士。3年 EHS 工作经历。希望从传统工科转入 IT 或数字化行业，目标是高薪、成长性和城市机会。";
      renderCompetition();
    }

    countrySelect.addEventListener("change", renderUniversities);
    degreeSelect.addEventListener("change", toggleMasters);
    $("qsTopBtn").addEventListener("click", () => setSchoolMode("top200"));
    $("qsAfterBtn").addEventListener("click", () => setSchoolMode("after200"));
    $("customUniversity").addEventListener("change", autofillCustomSchool);
    $("caseBtn").addEventListener("click", fillCase);
    $("evaluateBtn").addEventListener("click", renderCompetition);
    $("recommendBtn").addEventListener("click", renderCareerPlan);

    let lastRenderedReport = "";
    let lastRenderedSnapshot = "";

    function profileSnapshot() {
      return JSON.stringify(getProfile());
    }

    function markStaleIfNeeded() {
      if (!lastRenderedReport || !lastRenderedSnapshot || profileSnapshot() === lastRenderedSnapshot) return;
      const stale = lastRenderedReport === "competition" ? $("competitionStale") : $("careerStale");
      if (stale) stale.classList.add("show");
    }

    ["country", "university", "customUniversity", "schoolTier", "customQsRank", "customChinaRank", "degree", "major", "bachelorSchool", "bachelorMajor", "masterSchool", "masterMajor", "courses", "targetRoles", "targetCities", "background"].forEach(id => {
      $(id).addEventListener("input", markStaleIfNeeded);
      $(id).addEventListener("change", markStaleIfNeeded);
    });

    initSelectors();
    setSchoolMode("top200");
    toggleMasters();
  </script>
</body>
</html>
